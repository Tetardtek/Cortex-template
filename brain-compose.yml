  - version: "2.3.4"
    date: "2026-09-28"
    notes: "Le moteur tient le reboot : l'unite dolt-server ne s'ordonne plus apres default.target, un cycle que systemd cassait en supprimant le demarrage du moteur. Une cle d'environnement vide vaut sa valeur par defaut dans tout le moteur (un port vide faisait planter moteur et MCP, des scopes vides n'en donnaient aucun). MYSECRETS.example ne laisse vides que les jetons ; les reglages y sont commentes avec leur vraie valeur par defaut, tenue par un test. Chaque table de la base appartient a un module (brain-engine/modules.yml). Une page Se mettre a jour ; kernel-update-check.sh, mort chez tous les forks, est retire."
  - version: "2.3.5"
    date: "2026-09-28"
    notes: "La recherche semantique dit ce qui lui manque. Sans Ollama, brain_search repond Recherche indisponible au lieu de Aucun resultat, brain_boot le dit, les routes rendent 503, embed sort en erreur ; le setup declare Ollama (etape 10) et scripts/ollama-setup.sh tire le modele et donne la commande du systeme. Le MCP local d'un fork voit ce que le role mcp voit (projets, focus, learning), comme la prod. Le setup ne dit plus le push verrouille a un fork dont le push est ouvert ; l'exemple de config locale a la forme du setup ; kernel_version devient le marqueur d'une mise a jour terminee, que helloWorld signale ; la page Se mettre a jour laisse git donner la version."
  - version: "2.3.6"
    date: "2026-09-28"
    notes: "Une mise a jour arrive vraiment. install systemd relance les unites au lieu de les demarrer (enable --now ne relancait pas une unite active : les scopes MCP de la v2.3.5 n'arrivaient pas), et la page Se mettre a jour le demande a la place d'un simple restart ; il ne parle plus d'instance manuelle a un moteur de systemd. L'embed periodique passe par un timer utilisateur (brain-embed.timer : 5 min apres l'ouverture, puis toutes les 2 h) au lieu d'une ligne crontab : pas de cron sur Arch, et un echec d'Ollama se lit dans systemctl status. learning/ devient un satellite comme les autres : ignore par le noyau, un README d'amorce, une ligne dans PATHS.md. Mise a jour depuis la v2.3.5 : relancer bash scripts/brain-engine.sh install systemd."
  - version: "2.4.0"
    date: "2026-09-29"
    notes: "Le verrou entre machines, un moteur qui voit ses services, et Cosmos qui se dessine. Le verrou de scope voit les sessions des machines satellites (une replica ouvre ses claims sous .<machine>, le fixe les lit sur leur branche) ; sans satellite, rien ne change. GET /state et brain_state lisent les unites systemd (pm2 seulement s'il sert) ; GET /infra et GET /logs sont retires (pm2 seul, et une liste de services ecrite en dur). Sans jeton, la machine elle-meme voit ses cinq zones (search n'en voyait que trois) ; brain_decisions ne rend que des ADR ; un claim ouvert sans --type est un explore. Cosmos se dessine enfin (Svelte 5 : la vue cherchait son conteneur avant qu'il existe) et s'arrete quand on la quitte ; brain-ui/.env.example ne dit que VITE_BRAIN_API. Les agents enseignent brain boot <type>[/<scope>] ; docs-verite sait juger un wiki (--wiki, pages journal) ; bsi-claim.sh annonce ses dix sous-commandes ; le pre-commit refuse les marqueurs de conflit ; brain-state-bot.sh retire. Les satellites sont les tiens : leurs README ne renvoient plus a un depot d'exemple. Mise a jour depuis la v2.3.6 : relancer bash scripts/brain-engine.sh install systemd, puis npm run build dans brain-ui."
  - version: "2.4.1"
    date: "2026-09-30"
    notes: "L'autonomie par paliers, et la machinerie de mars rangee. /workflows et brain_workflows disent ce qui avance en autonomie (la commande que la config locale declare dans BRAIN_RESUME_AUTONOMIE_CMD ; sans elle, une liste vide qui le dit) ; POST /workflows/create et POST /gate/.../approve sont retires. Les agents d'une machinerie qui n'a jamais tourne (kernel-orchestrator, supervisor, brain-hypervisor, context-broker, bsi-schema, satellite-boot, workflow-auditor, bact-scribe, time-anchor) ne partent plus, et les modes de brain-compose.yml avec le Mode rendering de KERNEL.md sont retires : le type de session suffit. todo-scribe tient la liste et kanban-scribe le mouvement, sur les fiches de chaque projet ; l'orchestrator compose une passe et la juge. /ws exige un jeton hors de la boucle locale (il rediffusait les evenements de session a tout le reseau). La table cosmos_edges, umap-positions.py et umap-edges.py sont retires : rien ne les lancait ni ne les lisait. bsi-claim.sh plantes voit les sessions coupees par un reboot ; l'energie d'un claim tient en trois niveaux (high, medium, low). La skill liste les types de commit que le hook applique ; la constitution passe en 1.1.1 et decrit les manifestes de session et le frontmatter des agents ; le checkpoint n'a plus qu'une adresse (handoffs/ et un signal CHECKPOINT). La suite de tests tourne en entier : 92 tests definis apres unittest.main() ne tournaient pas. Mise a jour depuis la v2.4.0 : relancer bash scripts/brain-engine.sh install systemd, puis bash scripts/schema-retraits.sh --appliquer (cosmos_edges ne part que si elle est vide)."
  - version: "2.4.2"
    date: "2026-09-30"
    notes: "Le boot dit qu'une version plus recente existe, sans insister. scripts/maj-disponible.py lit les tags vX.Y.Z de ton remote upstream (git ls-remote : aucun jeton, rien d'ecrit dans le depot) et les compare a ta version ; le timer brain-maj le fait une fois par jour, et le briefing ne lit que son etat : le demarrage ne touche jamais au reseau. Une ligne quand une version plus recente existe, rien sinon ; sans remote upstream, rien ; un amont injoignable ne passe pas pour a jour, et le briefing le dit apres sept jours sans nouvelles. Une information, jamais une injonction : tu restes libre de mettre a jour, ou non. Mise a jour depuis la v2.4.1 : relancer bash scripts/brain-engine.sh install systemd (il pose brain-maj.timer), et declarer l'amont s'il ne l'est pas : git remote add upstream <URL_DU_GABARIT>."
  - version: "2.4.3"
    date: "2026-10-02"
    notes: "Le gabarit dit ce qu'il porte, et les zones gardent aussi la lecture. Chaque dossier du brain a sa decision : modes/ et workflows/, restes de la v1, ne partent plus ; vie/ (prive : jamais indexe, GET /brain le reserve au proprietaire) et contenu/ (atelier, publie, archive, lus par le MCP) arrivent avec leur README, brain/cap.md avec un modele vide, profil/identity.exemple/ avec la forme de l'identite, jamais son contenu. GET /brain applique a la lecture les zones du role, comme l'ecriture : public ne lit que public, mcp pas le kernel. Un depot git pose sous le brain ne s'indexe plus ; projets/ s'indexe en entier. Le moteur recoit sa racine : BRAIN_ROOT designe le brain servi (sinon le parent de brain-engine/), le programme reste ou il est, et le moteur l'annonce au demarrage (brain-engine/racines.py). La regle du verrou expire vit dans le CORE (VERROU_ACTIF, VERROU_EXPIRE) : les routes, file-lock.sh et la conciergerie la lisent - la conciergerie disait > et <= ; le nettoyage des verrous se commite. GET /teams est retiree (rien ne l'appelait), la table circuit_breaker aussi (vide, jamais ecrite). brain-satellites.py suit un depot hors du brain (chemin:). Convention 2 : le plancher ethique de l'ecriture, concret - rien d'invente, une urgence vraie ou aucune, une sortie toujours possible. Mise a jour depuis la v2.4.2 : bash scripts/schema-retraits.sh --appliquer (circuit_breaker ne part que si elle est vide), puis relancer le moteur."
  - version: "2.5.0"
    date: "2026-10-02"
    notes: "Un brain demarre par une commande : brain serve. brain-engine/serve.py lance les deux portes (l'API et le serveur MCP) et porte leur declaration a un seul endroit : les ports, le mode et les scopes du MCP local se calculent au demarrage - les defauts, puis brain-engine/.env.local, puis MYSECRETS (sauf en demo), puis l'environnement deja pose - et ne sont plus recopies dans les unites systemd. MYSECRETS se lit comme un EnvironmentFile de systemd, ligne CLE=valeur : rien n'y est plus execute (brain-engine.sh faisait source). brain serve http et brain serve mcp remplacent leur processus par le serveur, le PID suivi est le sien ; brain serve seul tient les deux portes et arrete l'une si l'autre tombe ; brain serve --declaration dit ce qui serait lance, sans jamais une valeur de secret. scripts/brain est le point d'entree, pose dans ~/.local/bin par install systemd ; brain-engine.sh start et les unites passent par lui, et le script verifie les ports que les serveurs ouvriront. Le CORE dit pourquoi il s'abstient : un Python sans pymysql n'est plus annonce comme un service injoignable. Le dernier focus est rendu, date, quand l'API ne repond pas (focus_instantane.py, a chaque passage de l'indexeur). Mise a jour depuis la v2.4.3 : bash scripts/brain-engine.sh install systemd (reecrit les unites brain-engine et brain-mcp, garde les anciennes a cote, pose la commande brain, relance le moteur et le MCP)."
  - version: "2.5.1"
    date: "2026-10-02"
    notes: "Les verrous de fichier voient toutes les machines. Sur un brain qui a des machines satellites (chacune ecrit sur sa branche de la base commune), POST /bsi/locks consultait le pair en HTTP - et la consultation n'aboutissait pas (sans jeton, a travers un pare-feu) : chaque machine accordait le verrou chez elle. db.verrous_du_reseau lit maintenant les verrous la ou ils sont ecrits, main et chaque branche satellite (une satellite lit main en direct) ; la route, le garde d'ecriture et le repli de file-lock.sh l'utilisent, et disent ce qu'ils ont lu. Un verrou appartient a la machine dont il porte le suffixe ; une base illisible refuse le verrou au lieu de l'accorder. install pm2 lance les deux portes par brain serve - il ne lancait que l'API, sans serveur MCP - et ne relit plus MYSECRETS en JavaScript. Le prenom de l'owner ne part plus avec le gabarit, et la synchro le refuse desormais. Les tests d'installation recoivent un HOME jetable : la suite reecrivait le vrai ~/.local/bin/brain. Mise a jour depuis la v2.5.0 : relancer le moteur - bash scripts/brain-engine.sh install systemd, ou install pm2 si pm2 fait tourner le brain."
  - version: "2.5.2"
    date: "2026-10-02"
    notes: "Un fork se garde et se teste comme le brain d'origine. Le gabarit livre NIVEAUX.yml : le moteur d'un fork en tire ses zones d'ecriture, et vie/ est de nouveau en zone kernel. Sans ce fichier, le moteur retombait sur ses listes en dur, et vie/ - livre depuis la v2.4.3 - etait en zone libre, que le role mcp peut ecrire. La suite du moteur est verte chez un fork installe : un test de script d'instance s'abstient chez un fork, et reste rouge si le script manque au brain d'origine ; les brains temoins recoivent le CORE livre. claims/ ne part plus (un claim de la v1.0 ; les claims vivent en base depuis BRAIN-042). Le repli statique de brain_focus s'annonce lui-meme. Mise a jour depuis la v2.5.1 : relancer les deux portes - bash scripts/brain-engine.sh install systemd, ou install pm2."
  - version: "2.5.3"
    date: "2026-10-02"
    notes: "Un fork installe a ce que le brain d'origine a. Le setup pose les hooks git (etape 11) : le claim d'une session reste en vie, la base suit les handoffs, et un commit doit porter un type declare dans KERNEL.md - un message libre est refuse, en le disant. Le setup resout chaque marqueur de PATHS.md, <PROJECTS_ROOT> compris (le dossier ou le brain est clone, ou PROJECTS_ROOT=) ; un fork deja installe se corrige en relancant le setup. Le catalogue des agents est regenere sur le gabarit : il decrit les agents livres, et plus les agents prives de l'instance d'origine (nom et resume) ni ceux qu'un fork n'a pas. Mise a jour depuis la v2.5.2 : bash scripts/install-brain-hooks.sh, puis remplacer <PROJECTS_ROOT> dans la ligne projects/ de PATHS.md - sans relancer tout le setup, dont l'etape 2 reecrit ~/.claude/CLAUDE.md."
  - version: "2.6.0"
    date: "2026-10-02"
    notes: "Un fork se controle lui-meme : brain doctor. Le gabarit livre le doctor (brain-engine/doctor/, avec ses ressources dans brain-engine/contrat/ et brain-engine/bench/) : une soixantaine de controles, chacun gardant une derive qui ne leve aucune erreur - un registre qui s'eloigne de sa source, un fichier declare au boot et disparu, un hook absent, une fiche de projet en double. Son code de sortie est le verdict ; un controle s'abstient, et le dit, quand ce qu'il mesure manque (Ollama, une sauvegarde)  ; les controles propres a l'instance d'origine ne partent pas. Un fork neuf est vert. La skill et docs/moteur.md disent quand le lancer et comment le lire. Le gabarit livre aussi kernel.lock (l'empreinte du noyau recu), NIVEAUX.yml declare ce qu'il porte et ce que l'installation cree, workspace/backlog/ existe, et la synchro refuse un YAML que le retrait des etiquettes casserait (un contexte d'archive casse depuis la V1 est repare). Mise a jour depuis la v2.5.3 : rien a migrer ; brain doctor pour voir."
  - version: "2.6.1"
    date: "2026-10-02"
    notes: "Les handoffs d'un fork, et un setup qu'on peut relancer. Le gabarit livre le modele de handoff (handoffs/_template.md) que trois fichiers distribues citent - le /checkpoint compris - et un README qui dit la frontiere : workspace/scratch/ pour la session en cours, handoffs/ pour une autre session, et la vie d'un handoff (active, consumed, archived). brain doctor le tient : un statut hors des trois rougit, un handoff active de plus de 14 jours aussi. scripts/scratch-nettoyable.py est livre : il liste, en lecture seule, ce qui peut partir de scratch/. L'etape 2 du setup ne remplace plus un ~/.claude/CLAUDE.md existant : s'il differe du modele, il reste intact et le modele est pose a cote (CLAUDE.md.modele) ; --reecrire-claude-md garde l'ancien geste. Le doctor d'un fork rougit aussi sur une fiche ouverte sous un projet archive. Mise a jour depuis la v2.6.0 : rien a migrer ; brain doctor pour voir."
  - version: "2.6.2"
    date: "2026-10-03"
    notes: "Le doctor juge les pistes d'apprentissage et chaque fiche de projet. La zone learning : une piste est learning/<piste>/README.md (son index et ses liens), avec un status: (seed, exploring, active, pause, close) et des feeds: qui designent quelque chose qui existe (un projet, une autre piste, vie/) ; la table de learning/README.md se genere (zone_learning.py --ecrire), et un projet sait quelles pistes le nourrissent (--projet). La zone projet : chaque fichier de projets/ est une fiche type: projet avec un status: dans l'enumeration ; une annexe se range dans projets/<slug>/. Le gabarit d'une fiche de projet est a jour (tous les statuts, repo:, vitrine:, prefixe:, palier:, et la regle : une fiche, c'est ce qui se construit). La fraicheur des fiches compte une relecture datee (Remesure le ...), meme faite sur beaucoup de fiches a la fois. Mise a jour depuis la v2.6.1 : rien a migrer ; brain doctor pour voir."
  - version: "2.6.3"
    date: "2026-10-03"
    notes: "Le moteur lit la posture de l'instance. Une instance dont la posture refuse d'ecrire le kernel (kernel_write: false dans brain-compose.yml, comme replica-nomad) demarre son moteur en mode satellite : PUT /brain y refuse la zone kernel, avant le jeton, le claim et la base ; un BRAIN_MODE pose ne peut que durcir ce mode (template, demo), jamais le lever. Jusqu'ici, seules les sessions lisaient la posture. La zone learning juge aussi la machine : une fiche de learning/ qui porte un constat systeme (/etc/, ~/.config/, un service, ufw, un paquet...) dit ou il a ete pris, par mesure_sur: en tete ou `> 📍 mesuré sur …` par section ; une piste sans constat systeme ne rougit jamais. Mise a jour depuis la v2.6.2 : rien a migrer ; une instance satellite redemarre son moteur (systemctl --user restart brain-engine brain-mcp) ; brain doctor pour voir."
  - version: "2.6.4"
    date: "2026-10-03"
    notes: "brain maj : recevoir une version du gabarit de bout en bout. A blanc par defaut, le plan (ta version, celle de l'amont, ce qui change, ce qui est a toi seul, ce que tu as modifie) ; --appliquer fusionne le tag, recalcule les fichiers generes au lieu de les fusionner (le catalogue des agents, les pages de la doc ; la table des pistes autour de son bloc), garde l'avant de chaque fichier genere qui change dans workspace/scratch/brain-maj-<version>/ avec les commandes pour comparer, reinstalle les unites si ce sont celles de ce brain, declare kernel_version. Un conflit sur un fichier ecrit a la main l'arrete avant toute fusion ; apres une fusion faite a la main, --appliquer fait la suite. Ce que tu as cree ne bouge pas : pistes, profil, todos (ignores par git), tes projets et tes agents (l'amont ne les a pas). Le setup n'ecrit plus a travers un ~/.claude/CLAUDE.md qui est un lien (vers un depot de dotfiles) : cp suit les liens, il ecrasait le fichier du depot, et un lien casse creait le fichier au bout du lien ; le modele rendu est pose a cote. Mise a jour depuis la v2.6.3 : la derniere a la main (docs/mettre-a-jour.md), les suivantes par brain maj."
  - version: "2.6.5"
    date: "2026-10-03"
    notes: "La version-relais vers la vue des agents : a recevoir AVANT la v2.7.0. Elle ne migre rien. En v2.7.0, agents/ devient une vue : des liens vers noyau/agents/ (le noyau livre) et instance/agents/ (tes surcharges, qui l'emportent), construite par brain vue et ignoree par git ; tous les chemins agents/<nom>.md restent justes. brain maj sait desormais recevoir cette version : avant la fusion, il range dans instance/agents/ les agents que tu as modifies (ta version gagne, celle de l'amont reste dans noyau/) et ceux que tu as crees ; le catalogue se calcule dans la vue ; une annulation remet l'arbre tel qu'il etait (celui de la v2.6.4 pouvait le laisser sale, et ne sait pas migrer). brain vue construit la vue et dit son etat : un agent ecrit dans la vue (git ne le voit pas), un lien faux, le verrou ; une instance dont la posture refuse le kernel a son noyau/ en lecture seule. brain aligne reprend la branche suivie sur une telle instance : le verrou leve le temps de la fusion, puis repose ; jamais git pull. Les hooks reconstruisent la vue apres un checkout (un worktree neuf) et une fusion ; le pre-commit juge la doc d'un brain migre ; le setup construit la vue (etape 12) ; le doctor juge la vue (la vue des agents ; abstenu sur un brain a plat). Mise a jour depuis la v2.6.4 : brain maj --appliquer, puis bash scripts/install-brain-hooks.sh (six hooks : post-checkout est nouveau) ; brain doctor pour voir. Passe par la 2.6.5 avant la 2.7.0."
  - version: "2.7.0"
    date: "2026-10-03"
    notes: "La vue des agents. agents/ devient une vue : des liens vers noyau/agents/ (le noyau livre) et instance/agents/ (tes surcharges, qui l'emportent), construite par brain vue et ignoree par git ; tous les chemins agents/<nom>.md restent justes. La recevoir DEPUIS LA v2.6.5 : le brain maj de la v2.6.4 ne sait pas migrer. brain maj range d'abord tes agents dans instance/agents/ - ceux que tu as modifies (ta version gagne ; celle du gabarit reste dans noyau/agents/ pour comparer) et ceux que tu as crees - puis fusionne ; le catalogue se calcule dans la vue, il ne se commite plus. Desormais, ton agent s'ecrit dans instance/agents/<nom>.md, puis brain vue --construire ; un fichier ecrit directement dans agents/ est signale (git ne le voit pas). Une instance dont la posture refuse le kernel a son noyau/ en lecture seule et s'aligne par brain aligne ; un worktree n'est pas verrouille (la garde y est le commit). La doc du noyau (KERNEL.md, la skill, docs/) dit noyau/ et instance/. Mise a jour depuis la v2.6.5 : brain maj (le plan dit ce qui est range), brain maj --appliquer, puis brain vue et brain doctor."
  - version: "3.0.0"
    date: "2026-10-04"
    notes: "Le programme seul. Le depot du programme ne suit plus de donnees : projets/, infrastructure/, workspace/, handoffs/ et les mesures sont des satellites, et son histoire repart d'un depot neuf. Les agents : ta couche s'ajoute sans remplacer - instance/agents/<nom>.complement.md est assemble par brain vue a la suite de l'agent du noyau ; un complement peut porter une carte calculee (<!-- carte: <dossier> -->), tiree des tables de competences de ce dossier, donnee et non consigne. Les agents distribues ne portent plus rien de l'owner (ni niveau ni ressenti), quatorze agents morts sont archives, et les manifestes de session ne rechargent plus les fichiers du bootstrap. Le briefing se calcule (brain briefing), le focus aussi ; intentions/ et metabolism/ sont retires. Le verbe brain est reserve au terminal. Tes satellites restent hors de ton depot : projets/, handoffs/, infrastructure/, workspace/ et instance/agents/ sont desormais ignores comme les autres (README et modeles mis a part) ; ce que ton depot en suit deja le reste - versionne-le a part. brain maj nomme les surcharges que le noyau change (workspace/scratch/brain-maj-<version>/surcharges.md), s'arrete sur tout fichier a toi la ou la version en livre un, et passe desormais la main au maj de la version recue. SI TU VIENS DE LA 2.7.0 : c'est ton maj de la 2.7.0 qui recoit celle-ci, et il ne sait encore rien de tout ca. Avant : deplace tout fichier a toi place la ou le gabarit livre un fichier. Apres : pour chaque instance/agents/<nom>.md, git diff v2.7.0 v3.0.0 -- noyau/agents/<nom>.md, et reprends ce qui te sert."
  - version: "3.0.1"
    date: "2026-10-05"
    notes: "Un fork neuf est sain. brain doctor ne tue plus le moteur d'un fork lance par brain-engine.sh start (un test jouait le vrai install systemd, qui arrete l'instance manuelle de son brain). Le doctor d'un fork neuf est vert : une donnee de satellite pas encore ecrite (handoffs/LATEST.md) est dite, pas comptee ; le README livre dans projets/ n'est pas une fiche ; les journaux du moteur (brain-engine.log, brain-mcp.log) sont declares ; sans session systemd, le controle des unites s'abstient au lieu de dire vert sans rien juger. Le .gitignore ignore .env.local et __pycache__/. Ton README a toi : ecris instance/README.src.md, et python3 scripts/docs-generer.py --ecrire en fait ton README.md (le bloc genere:satellites y liste tes satellites si tu les declares dans satellites.yml) ; sans lui, tu gardes celui du gabarit. Corrige : les notes de la 3.0.0 disaient le briefing pose par le hook SessionStart - ce hook est un reglage de l'instance d'origine, il ne part pas."
  - version: "3.1.0"
    date: "2026-10-05"
    notes: "Ta couche au-dela des agents. Trois complements, a toi, dans instance/ - jamais livres par le gabarit, jamais touches par une mise a jour. Ce que ton boot charge en plus : instance/contexts/session-<type>.complement.yml (L1, L2.extras), lu apres le manifest - les manifests de contexts/ restent du programme, n'y ecris plus. Tes regles de travail en plus : instance/specs/collaboration.complement.md, lu par helloWorld apres profil/specs/collaboration.md. Tes pages de la skill : instance/skill/, que brain vue montre a la skill par le lien skills/brain/instance (ignore par git). brain doctor juge les trois : un fichier nomme absent, une cle que le boot ne lit pas, un fichier de instance/specs/ jamais lu, le lien de la skill. Corrige : le L2 du manifest brain valait extras None, il vaut une liste vide. Rien a faire a la main : brain maj, puis brain doctor."
