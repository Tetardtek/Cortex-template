# brain-compose.yml — Kernel spec
# Versionné dans le kernel. Schema + feature flags + registre agents.
# Géré par l'agent brain-compose — ne pas éditer manuellement.

version: "3.1.0"

# ---
# Ownership — kerneluser
# true  : propriétaire de ce brain — écriture zone:kernel autorisée (human-confirmed)
# false : utilisateur invité (SaaS futur) — zone:kernel bloquée
# Défaut : true sur tout brain forké (l'owner est toujours kerneluser)
# ---
kerneluser: true
identityShow: on    # conséquence de kerneluser: true — présence visuelle complète des agents
                    # kerneluser: false → identityShow: off (mode clean/pro — BaaS client)

# ---
# Postures — rôle de l'instance dans la flotte (BRAIN-069)
# Orthogonal à kerneluser (identité owner) et tier (accès features).
# Déclaré par instance dans brain-compose.local.yml sous instances.<name>.posture
# Défaut implicite si non déclaré : master (rétrocompat — un brain seul est master)
# ---
postures:

  master:
    description: "Source prioritaire — tous droits, brain build autorisé"
    sessions: "*"            # tous les types de session autorisés
    kernel_write: true       # écriture zone:kernel autorisée (avec confirmation humaine)

  replica-nomad:
    description: "Owner complet, projet uniquement, brain build bloqué par défaut"
    sessions: [work, explore, chill]   # 'brain' et 'pilote' bloqués par défaut
    kernel_write: false                # zone:kernel en lecture seule
    override_env: BRAIN_KERNEL_OVERRIDE # variable env pour override exception (déplacement long + truc cassé)
    enforcement:
      filesystem: "chmod -w sur agents/ profil/ scripts/"
      git_hook: "scripts/hooks/pre-commit-posture refuse kernel:/feat:/fix: sur paths kernel"
      preflight: "helloWorld step 4.5 vérifie posture au boot, bloque session brain sans override"


# ---
# Modes — retirés le 30/09. BRAIN-047 les dépréciait (« le type suffit ») ;
# rien ne lisait `modes:` ni `detectmode:`, et leurs permissions (`brain_write`)
# n'étaient appliquées nulle part. Les permissions réelles : le hook
# pre-commit-zone, les gardes du moteur, la forge (tronc protégé).
# ---

