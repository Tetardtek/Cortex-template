# NIVEAUX.yml — de quelle nature est chaque chose, à la racine de ton brain
#
# Le moteur en tire ses zones d'ÉCRITURE :
#   - `invariant` : personne ne l'écrit par l'API, pas même un rôle kernel ;
#   - `programme`, et ce qui porte `zone: kernel` (`profil/`, `scripts/`,
#     `vie/`) : zone kernel. Un rôle sans ce scope — le MCP — n'y écrit pas ;
#   - le reste, et ce qui n'est pas déclaré : zone libre.
#
# Rendu par la synchro depuis la source du brain d'origine, restreint à ce que
# le gabarit porte. Il est à toi : déclare ici ce que tu ajoutes à la racine.

version: 1
niveaux:
  invariant: ne change pas sans confirmation humaine explicite
  programme: 'conçu, versionné, distribuable — et ombrable : une instance peut le surcharger'
  moteur: du code qui s'exécute
  donnee: appartient à l'utilisateur, ne se distribue jamais
  etat: volatile, régénérable, ne se versionne pas
  artefact: produit par une commande, jamais écrit à la main
  satellite: monté à côté, vit hors du dépôt
  vestige: n'a plus d'usage — la décision de retirer est prise, le geste reste à faire
entrees:
  NIVEAUX.yml: invariant
  agents/:
    niveau: programme
    vue_de:
    - noyau/agents/
    - instance/agents/
  brain-compose.local.yml:
    niveau: etat
    cree_par: le setup
