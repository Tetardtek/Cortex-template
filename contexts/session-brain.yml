# session-brain.yml v2 — Sessions V2 (BRAIN-047)
# Posture : je construis le système
# Absorbe : brain, edit-brain, kernel
# Trigger : "brain boot brain[/<scope>]"
# Cible : ~22% contexte max au boot

#
# --- Ce que « L0 » veut dire, et ce qu'il ne veut pas dire -------------------
#
# L0 n'est PAS « tout ce qui est toujours chargé ». CLAUDE.md, lu à chaque
# session quel que soit le type, charge déjà PATHS.md, profil/specs/collaboration.md,
# agents/coach-boot.md, agents/secrets-guardian.md et agents/helloWorld.md.
#
# L0 est ce que le TYPE de session ajoute avant tout le reste. Les deux
# s'additionnent ; aucun ne remplace l'autre, et leur intersection se réduit à
# PATHS.md.
#
# Écrit le 04/09 après mesure : trois endroits déclaraient le « toujours
# chargé » — CLAUDE.md, les L0, et manifest.yml (retiré depuis). Ils ne disaient
# pas la même chose, et personne ne pouvait dire si c'était un désaccord ou une
# addition. C'en était une, mais rien ne l'écrivait.
#
# Les six L0 sont volontairement IDENTIQUES. `contextes_de_session.py` refuse
# qu'ils divergent : un type qui charge autre chose que les autres au niveau
# zéro n'est plus le même socle.

session_type: brain
description: "Session de construction du brain — agents, kernel, profil, scripts"

# ── Duree de vie du claim, en heures — ─────────────────────────────
#
# Le TTL n'est PAS une limite de travail : `touch` le repousse a chaque commit.
# C'est la duree au bout de laquelle une session SANS SIGNE DE VIE devient
# suspecte — `close-stale` la ferme passe son propre seuil, 12 h de plus.
#
# Il vit ICI, a cote de la posture qui le justifie : c'est le manifest qui
# declare la posture, donc c'est lui qui declare combien elle dure.
#
# statut : mesure
#   23 sessions mesurees, moyenne 1,9 h
ttl_hours: 4

# L0 — Invariant (~5%) — TOUJOURS charge
L0:
  - PATHS.md
  - brain-compose.local.yml
  - KERNEL.md

# L1 — Session type (~12%)
# BRAIN-072 : L1_featured fusionne ici.
L1:
  # ── La carte des chantiers —, le 17/09 ──────────────────────────
  #
  # `LATEST.md` ecrivait « lu par helloWorld au boot » depuis des semaines, et
  # AUCUN manifest ne le chargeait : helloWorld ne lit un handoff que sur signal
  # CHECKPOINT/HANDOFF explicite. Une affirmation qu'aucun mecanisme n'appliquait
  # — une affirmation que rien ne verifiait, comme d'autres relevees la meme semaine.
  #
  # Son defaut n'etait donc pas son cout, c'etait son inutilite : il grossissait
  # (343 lignes) et personne ne le consommait, donc rien ne forcait sa tenue.
  # Il est passe en index — 51 lignes — et il entre ici.
  #
  # Ce qu'il apporte : savoir ou en est chaque chantier et ce qui attend l'owner
  # SANS charger le contexte d'aucun backlog. La doctrine BHP appliquee a l'etat
  # des projets — charger pour choisir, au lieu de charger pour savoir.
  #
  # Ce qui le tient a jour : `brain doctor`, controle « l etat annonce vs la
  # forge ». Un index que rien ne verifie ne ferait que deplacer le defaut.
  # cap servi par brain_focus() MCP — plus de lecture fichier directe
  # focus.md genere depuis Dolt via API /focus — plus de fichier statique
  - BRAIN-INDEX.md                  # aiguillage BSI — les claims et signaux sont en base
  # todos : source unique Dolt (todo_items/todo_sections) depuis 2026-04-08 — plus de fichier todo/brain.md
  - agents/coach-boot.md            # garde comportemental
  - agents/coach.md                 # coach complet — gardien kernel, gate decisions
  - agents/brain-guardian.md        # auto-mefiance structurelle
  - agents/scribe.md                # mise a jour brain apres session

# L2 — Scope conditionnel (~5%)
L2:
  # Etait `null` : `brain boot brain/myeline` ne chargeait pas projets/myeline.md,
  # alors que le type prevu pour construire le systeme est celui qui en a le plus
  # besoin. Les scopes sans fiche projet (kernel, agents) ne chargent rien —
  # `fallback: null` le dit.
  template: "projets/{project}.md"
  extras:
  fallback: null

# L3 — On demand
# agents/orchestrator.md, wiki/context-loading.md, scripts detailles
# Scope /kernel → write-lock (gate humain sur toute ecriture kernel)
# Scope /agents → agents/AGENTS.md charge
L3:
  hint: "Charger a la demande : orchestrator, bsi-schema, context-loading, AGENTS.md"

# --- Comportements absorbes ---
# edit-brain : gate humain obligatoire avant write kernel
#              → comportement actif quand scope touche KERNEL.md, CLAUDE.md, brain-constitution.md
#              → kernel.lock regenere apres modification kernel
# kernel     : write-lock implicite si scope = /kernel (lecture seule)
#              → toute tentative write → "Gate kernel — confirmer ? (oui/non)"

# --- Gates ---
gates:
  kernel_write: "confirmation humaine explicite avant toute ecriture sur KERNEL.md, CLAUDE.md, brain-constitution.md, profil/ Invariant"
  kernel_lock: "regenerer kernel.lock apres modification kernel"

# --- Metriques cibles ---
context_target:
  L0: "~5%"
  L1: "~12%"
  L2: "~5%"
  total_boot: "~22%"
